<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stock</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone">
    
      <main class="app">
        
    <header class="blue-header">
      
      
    <div class="brand">
      <img src="assets/logo-fridge.png" alt="Food Stock" />
      <strong>
        Food <span>Stock</span>
      </strong>
    </div>
      <h2>Frezer</h2>
    </header>
        <section class="white-panel storage">
          <h1>Frezer</h1>
          <p>Organiza tus alimentos por categoria</p>
          <button class="category-card"><span class="emoji">🧀</span><span><b>Lácteos y Derivados</b><small>Leches, Quesos, Yogures</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🥬</span><span><b>Verduras y Hortalizas</b><small>Productos frescos y saludables.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🍓</span><span><b>Frutas</b><small>Frutas frescas.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🥤</span><span><b>Bebidas</b><small>Aguas, Jugos, Gaseosas y más.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🍪</span><span><b>Dulces, Repostería y Snacks</b><small>Azúcar, Dulce de leche, frutos secos, etc.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🌱</span><span><b>Dietética, Vegano y Especiales</b><small>Bebidas Vegetales, Tofu, Semillas, etc.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🥩</span><span><b>Carnes</b><small>Cerdo, Vaca, etc.</small></span><i data-lucide="chevron-right"></i></button>
        </section>
        
    <nav class="bottom-nav">
      <button class="" onclick="window.location.href='space.html'">
        <i data-lucide="home"></i>
        <span>Inicio</span>
      </button>
      <button class="" onclick="window.location.href='account.html'">
        <i data-lucide="user"></i>
        <span>Cuenta</span>
      </button>
      <button>
        <i data-lucide="bell"></i>
        <span>Alertas</span>
      </button>
    </nav>
      </main>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
