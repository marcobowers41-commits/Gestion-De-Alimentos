<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stock - Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="phone">

    <main class="auth">

      <div class="brand">
        <img src="assets/logo-fridge.png" alt="Food Stock">
        <strong>
          Food <span>Stock</span>
        </strong>
      </div>

      <h1>Bienvenido</h1>

      <form id="loginForm">
        <input
          id="email"
          name="email"
          placeholder="Email o Nombre de Usuario"
          type="text"
          required
        >

        <input
          id="password"
          name="password"
          placeholder="Contraseña"
          type="password"
          required
        >

        <button type="submit" class="blue-btn big">
          Iniciar sesión
        </button>
      </form>

      <button
        class="text-link"
        onclick="window.location.href='forgot.html'"
      >
        ¿Olvidaste tu contraseña?
      </button>

    </main>

  </div>

  <script src="js/login.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
