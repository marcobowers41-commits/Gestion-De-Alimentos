<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stock - Alergias</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone">
    
      <main class="form-page">
        
    <div class="brand">
      <img src="assets/logo-fridge.png" alt="Food Stock" />
      <strong>
        Food <span>Stock</span>
      </strong>
    </div>
        <p class="italic center">Alergias e intolerancias.</p>
        <label>Ingrese cuales son sus<br/>Alergias:</label>
        <input id="al-alergias" class="pill-input full" />
        <label class="blue-label">Tipos de Intolerancias:</label>
        <div id="al-intolerances" class="pill-grid">
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Lactosa<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Histamina<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Fructosa<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Gluten<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">FODMAP<i></i></button>
        </div>
        <button id="btn-siguiente" class="next">Siguiente</button>
      </main>
  </div>
  <script src="js/allergies.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
