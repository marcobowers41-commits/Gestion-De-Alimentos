<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stock - Familia</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone">
    
      <main class="form-page">
        
    <div class="brand">
      <img src="assets/logo-fridge.png" alt="Food Stock" />
      <strong>
        Food <span>Stock</span>
      </strong>
    </div>
        <p class="italic">Responde las siguientes<br/>preguntas:</p>
        <label>Cuantos integrantes son en<br/>tu familia?</label>
        <input id="fam-cantidad" class="pill-input small" type="number" value="4" placeholder="4" />
        <label>Tipo de Alimentación:</label>
        <div id="fam-diets" class="pill-grid">
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Vegana<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Celiaca<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Omnívoro<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Vegetariana<i></i></button>
          <button type="button" class="pill" onclick="this.classList.toggle('selected')">Diabética<i></i></button>
        </div>
        <button id="btn-siguiente" class="next">Siguiente</button>
      </main>
  </div>
  <script src="js/family.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
