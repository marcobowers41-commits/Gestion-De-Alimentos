<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Stock</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="phone">
    
      <main class="app">
        
    <header class="blue-header">
      
      
    <div class="brand">
      <img src="assets/logo-fridge.png" alt="Food Stock" />
      <strong>
        Food <span>Stock</span>
      </strong>
    </div>
      <h2>Despensa</h2>
    </header>
        <section class="white-panel storage">
          <h1>Despensa</h1>
          <p>Organiza tus alimentos por categoria</p>
          <button class="category-card"><span class="emoji">🫙</span><span><b>Aceites, Condimentos y salsas</b><small>Aceite de girasol, sal, salsa de tomate, etc.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🍚</span><span><b>Secos y Cereales</b><small>Productos frescos y saludables</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🍪</span><span><b>Galletitas</b><small>Masitas, facturas, etc.</small></span><i data-lucide="chevron-right"></i></button>
          <button class="category-card"><span class="emoji">🌱</span><span><b>Dietética, Vegano y Especiales</b><small>Bebidas Vegetales, Tofu, Semillas, etc.</small></span><i data-lucide="chevron-right"></i></button>
        </section>
        
    <nav class="bottom-nav">
      <button class="" onclick="window.location.href='space.html'">
        <i data-lucide="home"></i>
        <span>Inicio</span>
      </button>
      <button class="" onclick="window.location.href='account.html'">
        <i data-lucide="user"></i>
        <span>Cuenta</span>
      </button>
      <button>
        <i data-lucide="bell"></i>
        <span>Alertas</span>
      </button>
    </nav>
      </main>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
