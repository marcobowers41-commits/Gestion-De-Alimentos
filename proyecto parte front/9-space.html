<!DOCTYPE html>
<html lang="es">
<head>

<body>
  <div class="phone">

    <header class="blue-header">

    </div>
      
    </header>
        <section class="white-panel space">

          <button class="space-btn" onclick="window.location.href='10-fridge.html'"><i data-lucide="plus"></i> Heladera</button>
          <button class="space-btn" onclick="window.location.href='12-pantry.html'"><i data-lucide="plus"></i> Almacen</button>

    lucide.createIcons();
