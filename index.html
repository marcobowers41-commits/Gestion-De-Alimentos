<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cocina - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-200 h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- PANTALLA PRINCIPAL: Formulario Previo -->
    <div id="pantalla-formulario" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-200">
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">👨‍🍳</div>
            <h1 class="text-2xl font-bold text-gray-800">¿Qué cocinamos hoy?</h1>
            <p class="text-gray-500 text-sm">Completá los datos para que el Chef revise el stock.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad de Personas</label>
                <input type="number" id="form-personas" value="1" min="1" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Comida</label>
                <select id="form-tipo" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
                    <option value="desayuno">Desayuno</option>
                    <option value="almuerzo">Almuerzo</option>
                    <option value="merienda">Merienda</option>
                    <option value="cena">Cena</option>
                    <option value="postre">Postre</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Buscar ingredientes en...</label>
                <select id="form-origen" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
                    <option value="heladera">Heladera</option>
                    <option value="freezer">Freezer</option>
                    <option value="alacena">Alacena / Fuera de heladera</option>
                    <option value="todo">En toda la cocina</option>
                </select>
            </div>

            <button onclick="iniciarChat()" class="w-full mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors">
                Consultar al Chef Virtual <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- MODAL DEL CHAT (Oculto por defecto) -->
    <div id="modal-chat" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="w-full max-w-2xl h-[85vh] bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
            
            <!-- Cabecera del chat -->
            <div class="bg-orange-500 text-white p-4 flex items-center justify-between shadow-md z-10">
                <div class="flex items-center gap-3">
                    <div class="bg-white text-orange-500 rounded-full w-10 h-10 flex items-center justify-center text-xl shadow-sm">👨‍🍳</div>
                    <h2 class="font-bold">Chef Virtual</h2>
                </div>
                <button onclick="cerrarChat()" class="text-white hover:text-gray-200 text-xl"><i class="fas fa-times"></i></button>
            </div>

            <!-- Historial -->
            <div id="historial" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50 flex flex-col">
                <!-- Los mensajes irán acá -->
            </div>

            <!-- Indicador de carga -->
            <div id="indicador-carga" class="hidden px-8 py-2 text-sm text-gray-500 italic flex items-center gap-2 bg-slate-50">
                <i class="fas fa-spinner fa-spin text-orange-500"></i> El chef está revisando el stock...
            </div>

            <!-- Entrada de texto -->
            <div class="p-4 bg-white border-t border-gray-200">
                <div class="flex gap-2 bg-gray-100 p-1 pl-5 rounded-full border border-gray-300 focus-within:border-orange-500">
                    <input type="text" id="input-mensaje" class="flex-1 bg-transparent outline-none text-gray-700" placeholder="Escribir mensaje..." onkeypress="if(event.key === 'Enter') enviarMensajeUsuario()">
                    <button onclick="enviarMensajeUsuario()" class="bg-orange-500 text-white rounded-full w-11 h-11 flex items-center justify-center shadow-sm"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulamos la base de datos
        const inventarioSimulado = {
            "heladera": "6 huevos, 1 cebolla, 300g de queso mozzarella, 1 puré de tomate",
            "freezer": "1kg de carne picada, 2 prepizzas",
            "alacena": "1 paquete de fideos, sal, aceite de girasol"
        };
        const perfilPrueba = "Le gusta comer abundante";
        let memoriaChat = [];

        async function iniciarChat() {
            const personas = document.getElementById('form-personas').value;
            const tipo = document.getElementById('form-tipo').value;
            const origen = document.getElementById('form-origen').value;

            // Filtramos qué stock le mandamos a la IA según lo que eligió el usuario en el select
            let stockAEnviar = "";
            if (origen === "todo") {
                stockAEnviar = `Heladera: ${inventarioSimulado.heladera}. Freezer: ${inventarioSimulado.freezer}. Alacena: ${inventarioSimulado.alacena}.`;
            } else {
                stockAEnviar = inventarioSimulado[origen];
            }

            // Guardamos el stock seleccionado de forma global para seguir mandándolo en cada turno
            window.stockActivo = stockAEnviar;

            const promptInicial = `Hola. Somos ${personas} personas y queremos comer ${tipo}. Buscá ingredientes en: ${origen}. ¿Qué opciones nos sugerís?`;

            document.getElementById('pantalla-formulario').classList.add('hidden');
            document.getElementById('modal-chat').classList.remove('hidden');
            document.getElementById('indicador-carga').classList.remove('hidden');

            procesarMensajeConIA(promptInicial, true);
        }
        function cerrarChat() {
            document.getElementById('modal-chat').classList.add('hidden');
            document.getElementById('pantalla-formulario').classList.remove('hidden');
            document.getElementById('historial').innerHTML = ''; // Limpiamos el chat visualmente
            memoriaChat = []; // Vaciamos la memoria
        }

        function enviarMensajeUsuario() {
            const input = document.getElementById('input-mensaje');
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensaje('yo', texto);
            input.value = '';
            document.getElementById('indicador-carga').classList.remove('hidden');
            
            procesarMensajeConIA(texto, false);
        }

async function procesarMensajeConIA(mensaje, esMensajeInicial) {
            memoriaChat.push({ rol: "Usuario", texto: mensaje });

            try {
                const respuesta = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensaje: mensaje,
                        stock: stockPrueba,
                        perfil: perfilPrueba,
                        historial: memoriaChat,
                        es_inicial: esMensajeInicial 
                    })
                });

                const respuesta_servidor = await respuesta.json();
                document.getElementById('indicador-carga').classList.add('hidden');
                
                if (respuesta_servidor.estado === 'exito') {
                    const datos_ia = respuesta_servidor.datos_ia;
                    
                    // Guardamos en memoria lo que dijo el Chef
                    memoriaChat.push({ rol: "Chef", texto: datos_ia.mensaje_chat });
                    
                    // Dibujamos el mensaje y le pasamos los botones
                    agregarMensajeBotConBotones(datos_ia.mensaje_chat, datos_ia.botones);
                    
                    // ACÁ OCURRE LA MAGIA PARA TUS COMPAÑEROS DE PHP (Fase 3 y adelante)
                    if (datos_ia.accion === "descontar_stock") {
                        console.log("¡ATENCIÓN BACKEND! Hay que descontar esto de la base de datos:", datos_ia.ingredientes_a_descontar);
                        // En el futuro, acá mandaremos un fetch a la ruta de PHP.
                    }
                    
                } else {
                    agregarMensaje('bot', '<span class="text-red-500">Error: ' + respuesta_servidor.mensaje + '</span>');
                }

            } catch (error) {
                document.getElementById('indicador-carga').classList.add('hidden');
                agregarMensaje('bot', '<span class="text-red-500">Error de conexión con el servidor.</span>');
            }
        }

        // Nueva función para dibujar el mensaje de la IA junto con sus botones
        function agregarMensajeBotConBotones(texto, botonesArray) {
            const historial = document.getElementById('historial');
            const divContenedor = document.createElement('div');
            divContenedor.className = `flex items-start gap-2 max-w-[85%] self-start flex-col`;
            
            // 1. Creamos la burbuja de texto
            const divBurbuja = document.createElement('div');
            divBurbuja.className = 'bg-white border border-gray-200 text-gray-800 p-4 rounded-2xl rounded-tl-none shadow-sm leading-relaxed w-full';
            
            let textoLimpio = texto.replace(/\*\*(.*?)\*\*/g, '<b class="font-bold text-gray-900">$1</b>');
            divBurbuja.innerHTML = textoLimpio.replace(/\n/g, '<br>');
            divContenedor.appendChild(divBurbuja);
            
            // 2. Creamos los botones interactivos abajo del mensaje (si es que hay)
            if (botonesArray && botonesArray.length > 0) {
                const divBotones = document.createElement('div');
                divBotones.className = 'flex flex-wrap gap-2 mt-2 ml-2';
                
                botonesArray.forEach(opcion => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-orange-100 hover:bg-orange-200 text-orange-800 text-sm font-semibold py-2 px-4 rounded-full border border-orange-300 transition-colors shadow-sm';
                    btn.innerText = opcion;
                    // Cuando tocás el botón, hace lo mismo que si lo hubieras escrito y tocado "Enviar"
                    btn.onclick = function() {
                        agregarMensaje('yo', opcion);
                        document.getElementById('indicador-carga').classList.remove('hidden');
                        procesarMensajeConIA(opcion, false);
                    };
                    divBotones.appendChild(btn);
                });
                
                divContenedor.appendChild(divBotones);
            }
            
            historial.appendChild(divContenedor);
            historial.scrollTop = historial.scrollHeight;
        }

        function agregarMensaje(emisor, texto) {
            const historial = document.getElementById('historial');
            const isYo = emisor === 'yo';
            const divContenedor = document.createElement('div');
            divContenedor.className = `flex items-start gap-2 max-w-[85%] ${isYo ? 'self-end flex-row-reverse' : 'self-start'}`;
            
            const divBurbuja = document.createElement('div');
            divBurbuja.className = isYo 
                ? 'bg-orange-500 text-white p-4 rounded-2xl rounded-tr-none shadow-sm leading-relaxed' 
                : 'bg-white border border-gray-200 text-gray-800 p-4 rounded-2xl rounded-tl-none shadow-sm leading-relaxed';
            
            divBurbuja.innerHTML = texto.replace(/\n/g, '<br>');
            divContenedor.appendChild(divBurbuja);
            historial.appendChild(divContenedor);
            historial.scrollTop = historial.scrollHeight;
        }
    </script>
</body>
</html>
